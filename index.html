<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>LimCash - Telegram Mini App</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
</head>
<body>
  <div class="app-container">

    <!-- Шапка приложения -->
    <header class="app-header">
      <div class="logo">LimCash</div>
      <div id="role-badge" class="badge">Загрузка...</div>
    </header>

    <!-- Основной контент (Вкладки) -->
    <main class="content">

      <!-- Вкладка 1: Главная / Калькулятор -->
      <section id="tab-calculator" class="tab-content active">
        <div class="card">
          <h2>Рассчитать стоимость</h2>

          <div class="form-group">
            <label for="staff-select">Выберите сотрудника:</label>
            <select id="staff-select" class="input-control">
              <!-- Заполняется из JS -->
            </select>
          </div>

          <div class="form-group">
            <label>Количество карточек:</label>
            <div class="counter-control">
              <button type="button" id="btn-minus" class="counter-btn">-</button>
              <input type="number" id="cards-count" value="1" min="1" readonly class="counter-input">
              <button type="button" id="btn-plus" class="counter-btn">+</button>
            </div>
          </div>

          <div class="price-box">
            <span>Итоговая стоимость:</span>
            <div class="price-values">
              <div id="price-byn" class="byn-text">5 BYN</div>
              <div id="price-rub" class="rub-text">~ 143 ₽</div>
            </div>
          </div>

          <button id="calc-action-btn" class="btn-primary full-width">Рассчитать</button>
        </div>
      </section>

      <!-- Вкладка 2: Отзывы -->
      <section id="tab-reviews" class="tab-content">
        <div class="section-header">
          <h2>Отзывы покупателей</h2>
          <button id="add-review-btn" class="btn-secondary" style="display: none;">+ Написать отзыв</button>
        </div>
        <div id="reviews-list" class="reviews-grid">
          <!-- Динамические отзывы -->
        </div>
      </section>

      <!-- Вкладка 3: Панель управления (Владелец / Сотрудники) -->
      <section id="tab-admin" class="tab-content">
        <h2>Панель управления</h2>

        <!-- Раздел Финансов -->
        <div class="card">
          <h3>Финансовая сводка</h3>
          <div id="finance-grid" class="finance-grid">
            <!-- Динамически рендерится из JS -->
          </div>
        </div>

        <!-- Управление заказами -->
        <div class="card">
          <h3>Список заказов</h3>
          <div id="orders-list" class="orders-list">
            <!-- Динамический список заказов -->
          </div>
        </div>
      </section>

      <!-- Вкладка 4: Чат -->
      <section id="tab-chat" class="tab-content">
        <div class="chat-container">
          <div id="chat-messages" class="chat-messages">
            <!-- Сообщения чата -->
          </div>
          <div class="chat-input-box">
            <input type="text" id="chat-input" placeholder="Введите сообщение..." class="input-control">
            <button id="chat-send-btn" class="btn-primary">Отправить</button>
          </div>
        </div>
      </section>

    </main>

    <!-- Навигация снизу (4 вкладки) -->
    <nav class="bottom-nav">
      <button class="nav-btn active" data-tab="tab-calculator">
        <span class="icon">🧮</span>
        <span class="label">Заказ</span>
      </button>
      <button class="nav-btn" data-tab="tab-reviews">
        <span class="icon">⭐</span>
        <span class="label">Отзывы</span>
      </button>
      <button class="nav-btn" id="nav-admin-btn" data-tab="tab-admin" style="display: none;">
        <span class="icon">📊</span>
        <span class="label">Панель</span>
      </button>
      <button class="nav-btn" data-tab="tab-chat">
        <span class="icon">💬</span>
        <span class="label">Чат</span>
      </button>
    </nav>

  </div>

  <!-- Модальное окно подтверждения расчета -->
  <div id="calc-modal" class="modal-overlay style-hidden">
    <div class="modal-card">
      <h3>Подтверждение расчета</h3>
      <p>Количество карточек: <b id="modal-cards-count">1</b></p>
      <p>Итого к оплате: <b id="modal-price-byn">5 BYN</b> (<span id="modal-price-rub">~143 ₽</span>)</p>
      <div class="modal-actions">
        <button id="modal-confirm-btn" class="btn-primary">Подтвердить</button>
        <button id="modal-cancel-btn" class="btn-close">✕</button>
      </div>
    </div>
  </div>

  <!-- Модальное окно создания отзыва -->
  <div id="review-modal" class="modal-overlay style-hidden">
    <div class="modal-card">
      <h3>Оставить отзыв</h3>
      <div class="form-group">
        <label>Оценка (1-5):</label>
        <input type="number" id="review-rating" value="5" min="1" max="5" class="input-control">
      </div>
      <div class="form-group">
        <label>Ваш отзыв:</label>
        <textarea id="review-text" rows="3" class="input-control"></textarea>
      </div>
      <div class="modal-actions">
        <button id="review-submit-btn" class="btn-primary">Отправить</button>
        <button id="review-cancel-btn" class="btn-close">Отмена</button>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
